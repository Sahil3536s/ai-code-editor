<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai-code-editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML = '<div style="background:#cc0000;color:white;padding:30px;z-index:9999999;position:fixed;top:0;left:0;width:100%;height:100vh;overflow:auto;font-family:monospace;font-size:16px;"><h1>FATAL ERROR</h1>' + event.filename + ':' + event.lineno + ' - ' + event.message + '<br><br>' + (event.error && event.error.stack ? event.error.stack.replace(/\n/g, '<br>') : '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="background:#cc0000;color:white;padding:30px;z-index:9999999;position:fixed;top:0;left:0;width:100%;height:100vh;overflow:auto;font-family:monospace;font-size:16px;"><h1>UNHANDLED REJECTION</h1>' + event.reason + '</div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
